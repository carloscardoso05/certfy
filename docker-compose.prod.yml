# Production stack for Dokploy (pull-only).
#
# The image is built outside the server and pulled from the registry; Dokploy
# never builds it. For a local build, combine with docker-compose.build.yml:
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.build.yml up --build
#
# Dokploy manages the Traefik labels and the network it needs; this file only
# exposes the container port. Copy .env.example to .env (or fill the Dokploy
# "Environment" tab) before deploying.

x-app: &app
  image: ${CERTFY_IMAGE:-docker.io/carloscardoso05/certfy:latest}
  restart: unless-stopped
  stop_grace_period: 30s
  pull_policy: always

services:
  app:
    <<: *app
    # Published for deployments without a domain (access by IP and port).
    # Remove it when Dokploy routes a domain to this service.
    ports:
      - "${APP_PORT:-4000}:4000"
    environment:
      PHX_SERVER: "true"
      PORT: "4000"
      PHX_HOST: ${APP_HOST:?APP_HOST is required}
      PHX_SCHEME: ${PHX_SCHEME:-https}
      PHX_PORT: ${PHX_PORT:-443}
      FORCE_SSL: ${FORCE_SSL:-true}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE is required}
      DATABASE_URL: ecto://${POSTGRES_USER:-certfy}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-certfy}
      POOL_SIZE: ${POOL_SIZE:-10}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
      RUSTFS_SCHEME: "http://"
      RUSTFS_HOST: rustfs
      RUSTFS_PORT: "9000"
      RUSTFS_REGION: ${RUSTFS_REGION:-us-east-1}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-certfy-templates}
      GOTENBERG_URL: http://gotenberg:3000
      CERTIFICATE_FROM_EMAIL: ${CERTIFICATE_FROM_EMAIL:-no-reply@certfy.local}
      CERTIFICATE_FROM_NAME: ${CERTIFICATE_FROM_NAME:-Certfy}
      BRAND_NAME: ${BRAND_NAME:-Certfy}
      BRAND_THEME: ${BRAND_THEME:-certfy}
      BRAND_MARK: ${BRAND_MARK:-certfy}
      BRAND_FROM_EMAIL: ${BRAND_FROM_EMAIL:-no-reply@certfy.local}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS: ${SMTP_TLS:-if_available}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
      gotenberg:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  # One-shot migration runner. Runs before `app` starts and exits.
  migrate:
    <<: *app
    command: ["bin/certfy", "eval", "Certfy.Release.migrate()"]
    restart: "no"
    environment:
      PHX_HOST: ${APP_HOST:?APP_HOST is required}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE is required}
      DATABASE_URL: ecto://${POSTGRES_USER:-certfy}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-certfy}
      POOL_SIZE: "2"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:19-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-certfy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-certfy}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-certfy} -d ${POSTGRES_DB:-certfy}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
    volumes:
      - rustfs_data:/data

  gotenberg:
    image: gotenberg/gotenberg:9-libreoffice
    restart: unless-stopped
    environment:
      LIBREOFFICE_AUTO_START: "true"

volumes:
  postgres_data:
  rustfs_data:
