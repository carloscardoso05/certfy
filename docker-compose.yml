services:
  postgres:
    image: postgres:19-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgres
  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: "rustfsadmin"
      RUSTFS_SECRET_KEY: "rustfsadmin"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
  gotenberg:
    image: gotenberg/gotenberg:9-libreoffice
    restart: unless-stopped
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  rustfs_data:
